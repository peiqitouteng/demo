name: CI

# 挂到两个位置：PR 进 main（交付门禁）、push 到 test（集成分支自检）
on:
  pull_request:
    branches: [main]
  push:
    branches: [test]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 占位：当前仓库只做流程演练。接入代码后换成真实的 lint / build / test。
      - name: 占位检查
        run: echo "CI 占位：接入代码后在 .github/workflows/ci.yml 里跑 lint / build / test"
      # 真实检查保留但不阻塞：发现问题只写进日志，不会让演练仓库变红。
      - name: 文档完整性检查（仅提示，不阻塞）
        continue-on-error: true
        run: node .github/scripts/check-docs.mjs
